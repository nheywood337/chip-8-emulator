name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # without these SDL quietly builds a dummy-only video driver
      - name: Install SDL2 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev \
                                  libxcursor-dev libxi-dev libgl1-mesa-dev \
                                  libasound2-dev

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

      - name: Smoke test the SDL frontend
        run: xvfb-run -a ./build/chip8 -r roms/1-chip8-logo.ch8 --frames 60
